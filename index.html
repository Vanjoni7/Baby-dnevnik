<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f9f3eb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Baby dnevnik"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>Baby dnevnik</title><style>
:root{--cream:#f9f3eb;--blush:#ecd2d0;--rose:#cb9094;--brown:#5b463f;--soft:#947d70;--sage:#adbda6;--peach:#e8b89e}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--brown);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.wrap{max-width:760px;margin:auto;padding:18px 16px 100px}header{padding:18px 4px}small,.muted{color:var(--soft)}header small{letter-spacing:2px;color:var(--rose);font-weight:700;font-size:10px}h1{font:32px Georgia,serif;margin:7px 0}h2{font:21px Georgia,serif;margin:12px 0}p{font-size:13px}.card,.entry{background:white;border-radius:19px;padding:16px;margin:12px 0}.hero{background:#ecd2d08c;display:flex;align-items:center;gap:15px}.heart{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:#ffffffa8;color:var(--rose);font-size:28px}.grid,.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stats{grid-template-columns:repeat(3,1fr)}.tile,.stat{border:0;background:white;border-radius:16px;padding:14px;text-align:left;color:var(--brown)}.tile b,.stat strong{display:block;margin:8px 0}.tile small,.stat small{font-size:11px;color:var(--soft)}.action{border:0;border-radius:13px;background:var(--rose);color:white;padding:12px 16px;font-weight:650}.ghost{border:1px solid var(--blush);background:white;color:var(--brown);border-radius:12px;padding:9px 12px}.danger{color:#b33;border:0;background:none}.row,.toolbar{display:flex;align-items:center;gap:10px}.toolbar{justify-content:space-between}.grow{flex:1}.entry h3{font-size:14px;margin:0 0 5px}.entry p{white-space:pre-wrap}.entry img{max-width:100%;max-height:220px;border-radius:12px}input,textarea,select{width:100%;border:1px solid #eadbd5;border-radius:12px;padding:12px;background:white;color:var(--brown)}textarea{min-height:75px}label{display:block;font-size:12px;color:var(--soft);margin:12px 0 6px}.actions{display:flex;gap:8px;margin-top:15px}.actions>*{flex:1}nav{position:fixed;bottom:0;left:0;right:0;background:#fffffff2;display:flex;justify-content:center;border-top:1px solid var(--blush);padding:8px 3px calc(7px + env(safe-area-inset-bottom));z-index:5}nav button{flex:1;max-width:120px;border:0;background:none;color:var(--soft);font-size:10px;padding:5px 0}nav button span{display:block;font-size:18px;margin-bottom:3px}nav button.active{color:var(--rose);font-weight:700}.hidden{display:none!important}.login{max-width:420px;margin:12vh auto;padding:20px}.login .card{text-align:center;padding:24px}.login .heart{margin:auto}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{height:40px;border:0;border-radius:10px;background:#faf7f3;color:var(--brown)}.day.sel{background:var(--rose);color:white}.week{text-align:center;font-size:11px;color:var(--soft)}.photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.photo-grid img{width:100%;height:145px;object-fit:cover;border-radius:12px}.notice{font-size:11px;color:var(--soft);line-height:1.5}@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}}
</style></head><body>
<div id="login" class="login"><div class="card"><div class="heart">♥</div><h1>Baby dnevnik</h1><p class="muted">Prijava u dnevnik</p><label>Korisničko ime</label><input id="user" autocomplete="username"><label>Lozinka</label><input id="pass" type="password" autocomplete="current-password"><p id="err" class="notice"></p><button class="action" style="width:100%" onclick="login()">Prijavi se</button></div></div>
<div id="app" class="hidden"><div class="wrap"><header><div class="toolbar"><div><small>MALI SVET, VELIKE USPOMENE</small><h1>Baby dnevnik</h1><p class="muted">Pratimo svaki njen mali korak.</p></div><button class="ghost" onclick="logout()">Odjava</button></div></header><main id="screen"></main></div><nav><button data-tab="home" class="active"><span>⌂</span>Početna</button><button data-tab="feeding"><span>♡</span>Hranjenje</button><button data-tab="growth"><span>↗</span>Rast</button><button data-tab="calendar"><span>▦</span>Kalendar</button><button data-tab="health"><span>✚</span>Zdravlje</button><button data-tab="more"><span>▤</span>Ostalo</button></nav></div>
<script>
const KEY="visnja_baby_web_v1";let entries=JSON.parse(localStorage.getItem(KEY)||"[]"),tab="home",editId=null,sel=new Date(),month=new Date();const N={feeding:"Hranjenje",growth:"Rast i razvoj",health:"Zdravlje",calendar:"Kalendar",memories:"Uspomene",notes:"Beleške"},C={feeding:["Dojenje – leva dojka","Dojenje – desna dojka","Dojenje – obe dojke","Adaptirano mleko","Izmlazano majčino mleko","Drugo"],growth:["Težina","Visina","Obim glave","Drugo"],health:["Temperatura","Simptomi","Bolest","Lek","Suplement","Terapija","Pregled","Vakcina","Drugo"],calendar:["Pregled","Vakcina","Podsetnik","Važan datum","Drugo"],memories:["Fotografija","Uspomena","Događaj","Drugo"],notes:["Beleška","Važna informacija","Drugo"]};const $=x=>document.getElementById(x),safe=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(entries))}function list(s){return entries.filter(x=>x.section===s).sort((a,b)=>b.date.localeCompare(a.date))}function date(s){return new Date(s).toLocaleString("sr-RS",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}
function row(e){return `<article class="entry"><div class="row"><div class="grow"><h3>${safe(e.title)}</h3><small>${N[e.section]} · ${date(e.date)}</small></div>${e.amount?`<b>${safe(e.amount)} ${safe(e.unit)}</b>`:""}</div>${e.details?`<p>${safe(e.details)}</p>`:""}${e.notes?`<p class="muted">${safe(e.notes)}</p>`:""}${e.photo?`<img src="${e.photo}">`:""}<div class="row" style="justify-content:flex-end"><button class="ghost" onclick="edit('${e.id}')">Izmeni</button><button class="danger" onclick="del('${e.id}')">Obriši</button></div></article>`}
function render(){let fn={home,feeding:()=>section("feeding"),growth:()=>section("growth"),health:()=>section("health"),calendar,more};$("screen").innerHTML=(fn[tab]||more)();document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab))}
function home(){let today=entries.filter(e=>new Date(e.date).toDateString()===new Date().toDateString()).length;return `<div class="card hero"><div class="heart">♥</div><div><small>Naša devojčica</small><h2>Višnja</h2><small>21. septembar 2026.</small></div></div><h2>Moj dnevni pregled</h2><div class="stats"><div class="stat"><small>Današnjih unosa</small><strong>${today}</strong></div><div class="stat"><small>Hranjenja</small><strong>${list("feeding").length}</strong></div><div class="stat"><small>Merenja</small><strong>${list("growth").length}</strong></div></div><h2>Višnjin mali svet</h2><div class="grid">${Object.keys(N).map(s=>`<button class="tile" onclick="add('${s}')"><b>${N[s]}</b><small>${({feeding:"Obroci i zagrljaji",growth:"Novi centimetri",health:"Zdravlje",calendar:"Važni datumi",memories:"Posebni trenuci",notes:"Važne beleške"})[s]}</small></button>`).join("")}</div><h2>Poslednje aktivnosti</h2>${entries.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4).map(row).join("")||'<p class="muted">Ovde će se pojavljivati Višnjini zapisi.</p>'}
function section(s){let extra=s==="growth"?`<div class="card"><b>Poslednja merenja</b><p class="muted">Težina: ${latest("Težina")}<br>Visina: ${latest("Visina")}<br>Obim glave: ${latest("Obim glave")}</p></div>`:"";return `<h2>${N[s]}</h2><button class="action" style="width:100%;margin:12px 0" onclick="add('${s}')">＋ Dodaj novi unos</button>${extra}<h2>Istorija unosa</h2>${list(s).map(row).join("")||'<div class="card muted">Još nema zapisa.</div>'}`}
function latest(t){let e=list("growth").find(x=>x.type===t&&x.amount);return e?safe(e.amount)+" "+safe(e.unit):"Nije uneto"}
function more(){return `<h2>Još naših trenutaka</h2><div class="grid"><button class="tile" onclick="add('notes')"><b>Beleške</b></button><button class="tile" onclick="add('memories')"><b>Uspomene</b></button><button class="tile" onclick="tab='all';render()"><b>Svi zapisi (${entries.length})</b></button><button class="tile" onclick="tab='photos';render()"><b>Album fotografija</b></button></div>${tab==="all"?entries.map(row).join(""):tab==="photos"?`<div class="photo-grid">${entries.filter(e=>e.photo).map(e=>`<img src="${e.photo}">`).join("")}</div>`:""}<p class="notice">Podaci se trenutno čuvaju samo u pregledaču na ovom uređaju. Za sinhronizaciju iPada i iPhone-a potrebno je posebno povezivanje sa bazom podataka.</p>`}
function calendar(){let y=month.getFullYear(),m=month.getMonth(),offset=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate(),cells=Array(offset).fill(0).concat(Array.from({length:n},(_,i)=>i+1)),items=entries.filter(e=>new Date(e.date).toDateString()===sel.toDateString());return `<div class="card"><div class="toolbar"><button class="ghost" onclick="month.setMonth(month.getMonth()-1);render()">‹</button><b>${month.toLocaleDateString("sr-RS",{month:"long",year:"numeric"})}</b><button class="ghost" onclick="month.setMonth(month.getMonth()+1);render()">›</button></div><div class="days">${["P","U","S","Č","P","S","N"].map(x=>`<div class="week">${x}</div>`).join("")}${cells.map(d=>d?`<button class="day ${new Date(y,m,d).toDateString()===sel.toDateString()?"sel":""}" onclick="sel=new Date(${y},${m},${d});render()">${d}</button>`:"<i></i>").join("")}</div></div><div class="toolbar"><h2>${sel.toLocaleDateString("sr-RS",{weekday:"long",day:"numeric",month:"long"})}</h2><button class="action" onclick="add('calendar')">＋</button></div>${items.map(row).join("")||'<div class="card muted">Nema zapisa za ovaj dan.</div>'}`}
function add(s){form(s)}function edit(id){let e=entries.find(x=>x.id===id);form(e.section,e)}function form(s,e=null){editId=e?.id||null;let v=e||{title:"",type:"",amount:"",unit:"",details:"",notes:"",date:new Date().toISOString().slice(0,16),photo:""};$("screen").innerHTML=`<h2>${e?"Izmena zapisa":"Novi zapis · "+N[s]}</h2><div class="card"><label>Naslov</label><input id="t" value="${safe(v.title)}"><label>Vrsta unosa</label><select id="type"><option value="">Izaberi vrstu</option>${(C[s]||[]).map(x=>`<option ${x===v.type?"selected":""}>${x}</option>`).join("")}</select><label>Vrednost / količina</label><input id="amount" value="${safe(v.amount)}" placeholder="npr. 4,250"><label>Jedinica</label><input id="unit" value="${safe(v.unit)}" placeholder="ml, kg, cm, °C..."><label>Datum i vreme</label><input id="dt" type="datetime-local" value="${String(v.date).slice(0,16)}"><label>Detalji</label><textarea id="details">${safe(v.details)}</textarea><label>Beleške</label><textarea id="notes">${safe(v.notes)}</textarea>${s==="memories"?`<label>Fotografija</label><input id="photo" type="file" accept="image/*">`:""}<div class="actions"><button class="ghost" onclick="render()">Otkaži</button><button class="action" onclick="saveForm('${s}')">Sačuvaj</button></div></div>`}
async function saveForm(s){let old=entries.find(e=>e.id===editId),photo=old?.photo||"",f=$("photo")?.files?.[0];if(f)photo=await new Promise(r=>{let fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});let e={id:editId||crypto.randomUUID(),section:s,title:$("t").value.trim(),type:$("type").value,amount:$("amount").value,unit:$("unit").value,date:new Date($("dt").value||Date.now()).toISOString(),details:$("details").value,notes:$("notes").value,photo};if(!e.title)e.title=e.type||N[s];if(editId)entries=entries.map(x=>x.id===editId?e:x);else entries.push(e);save();tab=s==="memories"||s==="notes"?"more":s;render()}
function del(id){if(confirm("Obrisati ovaj zapis?")){entries=entries.filter(e=>e.id!==id);save();render()}}
function login(){if($("user").value.trim()==="Visnja"&&$("pass").value==="Visnja2109"){$("login").classList.add("hidden");$("app").classList.remove("hidden");render()}else $("err").textContent="Pogrešno korisničko ime ili lozinka."}function logout(){$("app").classList.add("hidden");$("login").classList.remove("hidden");$("pass").value=""}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script></body></html>
